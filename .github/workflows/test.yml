# Vets and tests Sokki on macOS as pushes to master and pull requests come.
name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go tool mygo vet
      # -short skips the tests that touch the pasteboard; CI has no
      # Accessibility permission, so the event tap tests skip themselves.
      - run: go test -short ./...
